; Full-scale evaluation configuration (original paper parameters).
; Place the full-scale test data at data/full/naz_test_full.json (same JSON format as data/mini).
; lora_path points to the provided checkpoint; replace it with checkpoints/naz_full/final if you train full-scale yourself.
[global]
do_train = false
do_eval = true
seo = targeted

[eval.basic]
base_model = model/Qwen0.5B
tokenizer = model/Qwen0.5B
lora_path = checkpoints/naz_1_4_final
test_path = data/full/naz_test_full.json

[eval.search]
beam_width_list = [95,1000]+[1000]*14
batch_size = 1000
prompt_template_id = 0
vocab_limit = true
precision = half
eos_threshold = 0.001
max_guess_number = 1000

[eval.guesser]
result_path = results/full_eval
log_interval = 1
log_guess_number = [1,10,50,100,500,1000]
