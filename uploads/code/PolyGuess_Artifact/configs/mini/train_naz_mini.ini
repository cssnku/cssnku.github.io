[global]
do_train = true
do_eval = false
seo = targeted

[train.basic]
model = model/Qwen0.5B
tokenizer = model/Qwen0.5B
train_data = data/mini/naz_train_mini.json
validation_data = 

[train.trainer]
prompt_template_id = 0
precision = half

[train.lora]
r = 16
target_modules = ['q_proj','k_proj','v_proj']
lora_alpha = 32
lora_dropout = 0.2
bias = none 
init_lora_weights = true 

[train.hyperparameters] 
output_dir = checkpoints/mini_train_output/
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 16
weight_decay = 0.01
learning_rate = 5e-4
num_train_epochs = 1
warmup_ratio = 0.1
logging_steps = 1
save_steps = 100
data_seed = 42
seed = 42
bf16 = true
evaluation_strategy= steps
eval_steps = 100
eval_delay = 1
optim = adamw_torch
label_smoothing_factor = 0
