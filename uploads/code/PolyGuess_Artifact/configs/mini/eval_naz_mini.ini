[global]
do_train = false
do_eval = true
seo = targeted

[eval.basic]
base_model = model/Qwen0.5B
tokenizer = model/Qwen0.5B
lora_path = checkpoints/naz_1_4_final
test_path = data/mini/naz_test_mini.json

[eval.search]
beam_width_list = [10,100]+[100]*8
batch_size = 64
prompt_template_id = 0
vocab_limit = true
precision = half
eos_threshold = 0.001
max_guess_number = 100

[eval.guesser]
result_path = results/mini_eval
log_interval = 1
log_guess_number = [1,10,50,100]
